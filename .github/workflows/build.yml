# Build the style images and the plain image (no style baked in), test them
# with examples/, and push them to ghcr.io/<owner>/mylatex/<name>:<version>
# and ghcr.io/<owner>/mylatex:latest on every push to main.
# Pull requests only build and test.
name: Build images

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - Makefile
      - docker/**
      - style/**
      - examples/**
      - .github/workflows/build.yml
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - Makefile
      - docker/**
      - style/**
      - examples/**
      - .github/workflows/build.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
    steps:
      - uses: actions/checkout@v5

      # The TeX Live base image is about 9 GB once extracted.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      # ghcr.io requires a lowercase owner name.
      - name: Set image prefix
        run: echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/mylatex" >> "$GITHUB_ENV"

      - name: Build and test
        run: make test

      - name: Log in to ghcr.io
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin

      - name: Push
        if: github.ref == 'refs/heads/main'
        run: make push
